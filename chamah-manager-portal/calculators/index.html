<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>מחשבונים - פורטל מנהלות חמ״ה</title>
    <link rel="stylesheet" href="../assets/styles.css" />
  </head>
  <body>
    <main class="portal-shell calculator-hub-page">
      <header class="topbar">
        <a class="brand" href="../dashboard/">
          <small>מעונות חמ״ה</small>
          <strong>פורטל מנהלות</strong>
        </a>
        <nav class="dashboard-nav" aria-label="ניווט ראשי">
          <a class="nav-link" href="../dashboard/">דשבורד</a>
          <a class="nav-link active" href="../calculators/">מחשבונים</a>
        </nav>
      </header>

      <section class="hero calculator-hub-hero" aria-labelledby="calculators-title">
        <p class="eyebrow">כלי ניהול</p>
        <h1 id="calculators-title">מחשבונים</h1>
        <p class="subtitle">שני כלים עצמאיים לניהול שכר, תפוסה, תקינה ויתרה כיתה.</p>
      </section>

      <section class="calculator-hub-grid" aria-label="רשימת מחשבונים">
        <a class="calculator-card" href="../salary/">
          <span class="calculator-card-mark">₪</span>
          <div>
            <h2>מחשבון שכר</h2>
            <p>הערכת ברוטו, נטו משוער ותוספות שכר לעובדת.</p>
          </div>
          <strong>פתח מחשבון</strong>
        </a>

        <a class="calculator-card featured" href="../occupancy/">
          <span class="calculator-card-mark">מ״ר</span>
          <div>
            <h2>מחשבון תפוסה ותקינה</h2>
            <p>בדיקת שטח, תקינה, הכנסה, עלות צוות ויתרה חודשית לפי הרכב כיתה.</p>
          </div>
          <strong>פתח מחשבון</strong>
        </a>
      </section>
    </main>
  </body>
</html>
