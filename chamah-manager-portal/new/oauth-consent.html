<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>אישור חיבור חיצוני | חמ״ה</title><style>body{font-family:system-ui,Arial;background:#f2f6f4;color:#183d30;display:grid;place-items:center;min-height:100vh;margin:0}.panel{background:white;padding:32px;max-width:540px;width:90%;border-radius:16px;box-shadow:0 8px 36px #183d3015}button{padding:12px 22px;border:0;border-radius:9px;cursor:pointer}button:disabled{opacity:.5}.yes{background:#16664a;color:white}.no{background:#eee;margin-inline:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#actions{margin-top:22px}</style></head><body><main class="panel"><h1>אישור חיבור חיצוני לחמ״ה</h1><p>אישור החיבור מאפשר לאפליקציה חיצונית לפעול בשם החשבון שלך, בכפוף להרשאות שהוגדרו במערכת.</p><p id="status">בודק את בקשת ההתחברות…</p><section id="details" hidden><p><strong>אפליקציה:</strong> <span id="client"></span></p><p><strong>כתובת חזרה:</strong> <span id="redirect"></span></p><p><strong>הרשאות מבוקשות:</strong> <span id="scopes"></span></p><p><strong>שימו לב:</strong> אין לאשר בקשה שאינך מזהה. חיבור זה מיועד לקריאה בלבד דרך MCP.</p><div id="actions"><button class="yes" id="approve" disabled>מאשר/ת חיבור</button><button class="no" id="deny" disabled>דחייה</button></div></section></main><script type="module" src="/oauth-consent.js"></script></body></html>
